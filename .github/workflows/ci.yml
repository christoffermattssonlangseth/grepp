# Two checks on every push and pull request.
#
# `tests` runs the Foundation-only logic layer as a Swift package — the same
# files the app compiles, no simulator needed. `build` compiles the whole iOS
# app and its widget extension for the Simulator with signing switched off,
# which is what catches a view that doesn't compile. Neither needs a secret.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: swift test (LiftLogCore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: swift --version
      - run: swift test

  build:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: xcodebuild -version
      - name: Build the app and its widget extension
        run: |
          xcodebuild build \
            -project LiftLog.xcodeproj \
            -target LiftLog \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            | tail -60
          test "${PIPESTATUS[0]}" -eq 0
